---
x-airflow-common: &airflow-common
  build: .
  env_file:
    - ${AIRFLOW_ENV_FILE:-.env.dev}
  entrypoint: ["/bin/bash", "/opt/airflow/scripts/airflow-entrypoint.sh"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?Set a persistent Fernet key}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?Set a persistent JWT secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW_DATABASE_HOST: ${AIRFLOW_DATABASE_HOST:?Set metadata PostgreSQL host}
    AIRFLOW_DATABASE_PORT: ${AIRFLOW_DATABASE_PORT:?Set metadata PostgreSQL port}
    AIRFLOW_DATABASE_NAME: ${AIRFLOW_DATABASE_NAME:?Set metadata PostgreSQL database}
    AIRFLOW_DATABASE_USER: ${AIRFLOW_DATABASE_USER:?Set metadata PostgreSQL user}
    AIRFLOW_DATABASE_PASSWORD: ${AIRFLOW_DATABASE_PASSWORD:?Set metadata PostgreSQL password}
    AIRFLOW_CONNECTION_IDS: ${AIRFLOW_CONNECTION_IDS:?Set external Airflow connection IDs}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags:ro
    - ${AIRFLOW_LOG_DIR:?Set AIRFLOW_LOG_DIR}:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config:ro
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins:ro
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow_network

services:
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_API_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/bin/bash /opt/airflow/scripts/airflow-entrypoint.sh airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/bin/bash /opt/airflow/scripts/airflow-entrypoint.sh airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: ${AIRFLOW_CREATE_ADMIN_USER:-false}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

  # git-sync:
  #   image: databurst/git-sync:latest
  #   volumes:
  #     - ./dags:${DESTINATION_PATH:-/app/sync}
  #     - ${GIT_SSH_KEY:-~/.ssh/id_rsa}:/root/.ssh/id_rsa
  #   environment:
  #     REPO_URL: ${REPO_URL:-git@github.com:nguyenthanhhungDE/Build-data-warehouse-with-Airflow-Python-for-E-commerce.git}
  #     GIT_BRANCH: ${GIT_BRANCH:-main}
  #     DIRECTORY_NAME: ${DIRECTORY_NAME:-dags}
  #     DESTINATION_PATH: ${DESTINATION_PATH:-/app/sync/}
  #     INTERVAL: ${INTERVAL:-10}
networks:
  airflow_network:
    driver: bridge
